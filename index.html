<!DOCTYPE html>
<html lang="hu" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tennis Analyzer</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{color-scheme:light dark;}
  .toggle-btn svg{transition:transform .2s ease;}
</style>
</head>
<body class="bg-white text-gray-900 dark:bg-gray-900 dark:text-gray-200 transition-colors">
<div class="container mx-auto p-6">
  <header class="flex justify-between items-center mb-8">
    <h1 class="text-2xl font-bold">Tennis Analyzer</h1>
    <button id="theme-toggle" class="toggle-btn p-2 rounded-full bg-gray-200 dark:bg-gray-700">
      <svg id="sun" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M12 18a6 6 0 110-12 6 6 0 010 12zM12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      <svg id="moon" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3c.05.34.08.68.08 1a7 7 0 0010 8.79c.34 0 .68-.03 1-.08z"/></svg>
    </button>
  </header>
  <main>
    <p class="mb-4">Ez egy minta alkalmazás a sötét/világos mód tesztelésére.</p>
    <button class="px-4 py-2 bg-purple-600 text-white rounded hover:bg-purple-700">Minta gomb</button>
  </main>
</div>
<script>
(function(){
  const root=document.documentElement;
  const toggle=document.getElementById('theme-toggle');
  const sun=document.getElementById('sun');
  const moon=document.getElementById('moon');
  const stored=localStorage.getItem('theme');
  if(stored==='dark'||(!stored&&window.matchMedia('(prefers-color-scheme: dark)').matches)){
    root.classList.add('dark');
    sun.classList.remove('hidden');
    moon.classList.add('hidden');
  }
  toggle.addEventListener('click',()=>{
    const isDark=root.classList.toggle('dark');
    if(isDark){
      sun.classList.remove('hidden');
      moon.classList.add('hidden');
      localStorage.setItem('theme','dark');
    }else{
      sun.classList.add('hidden');
      moon.classList.remove('hidden');
      localStorage.setItem('theme','light');
    }
  });
})();
</script>
</body>
</html>
